<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HANABIRA48 | Ramadan Theater</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>

    <div class="ramadan-bg"></div>
    <div id="star-container"></div>
    
    <img src="assets/images/lampu.png" class="decor-hanging" alt="Lampu Gantung">
    <img src="assets/images/lantern.png" class="decor-standing" alt="Lentera">

    <div id="login-wrapper" class="view-center">
        <div class="glass-card login-anim">
            <div class="card-header">
                <img src="assets/images/logo.png" alt="Logo" class="logo-main">
                <p class="subtitle">REPLAY STAGE ACCESS</p>
            </div>

            <div class="input-group">
                <div class="input-icon-wrap">
                    <i class="fas fa-ticket-alt"></i>
                    <input type="text" id="credential-input" placeholder="Masukkan Email Tiket" autocomplete="off">
                </div>
            </div>
            
            <a href="https://wa.me/628567898135" target="_blank" class="help-link">
                <i class="fab fa-whatsapp"></i> Bantuan Tiket?
            </a>

            <div class="btn-container">
                <button id="submit-credential" class="btn-main glow-effect">
                    <span>MASUK STAGE</span> <i class="fas fa-arrow-right"></i>
                </button>
                <button id="reset-fingerprint-button" class="btn-ghost">
                    <i class="fas fa-sync-alt"></i> Reset Device
                </button>
            </div>
            
            <p id="credential-error-message" class="error-text"></p>
            <div class="card-footer">
                <small>© 2026 Hanabira48. Ramadan Edition V3.3.</small>
            </div>
        </div>
    </div>

    <div id="subscription-modal" class="modal-backdrop hidden">
        <div class="glass-card modal-anim">
            <div class="icon-circle-success"><i class="fas fa-check"></i></div>
            <h2>AKSES DITERIMA</h2>
            <p class="modal-desc">Sesi aktif satu kali (One-Time Session).</p>
            
            <div class="ticket-details">
                <div class="detail-row">
                    <span>Terdaftar</span>
                    <strong id="reg-date">-</strong>
                </div>
                <div class="detail-row">
                    <span>Berakhir</span>
                    <strong id="exp-date">-</strong>
                </div>
                <div class="detail-row highlight">
                    <span>Sisa Durasi</span>
                    <strong><span id="days-left">0</span> Hari</strong>
                </div>
            </div>

            <button id="close-modal-button" class="btn-main full-width">
                Masuk Dashboard <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="app-container" class="hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <script type="module" src="assets/js/replaystyle.js"></script>
    <script type="module" src="assets/js/replay.js"></script>

    <script>
        const starContainer = document.getElementById('star-container');
        const maxStars = 50; 
        function createStar() {
            if(starContainer.childElementCount > maxStars) return;
            const s = document.createElement('div');
            s.classList.add('star-sparkle');
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            const size = Math.random() * 4 + 2 + 'px';
            s.style.width = size;
            s.style.height = size;
            s.style.animationDuration = Math.random() * 3 + 2 + 's';
            starContainer.appendChild(s);
            setTimeout(() => { s.remove(); }, 4000);
        }
        setInterval(createStar, 150);
    </script>
</body>
</html>
